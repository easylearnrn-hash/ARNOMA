<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARNOMA - Student Profile Card Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
        --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        --dark-bg: #1a1d35;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.65);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #1a1d35;
        min-height: 100vh;
        padding: 40px 20px;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      /* Animated background gradient */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.12) 0%, transparent 50%);
        animation: gradientShift 20s ease infinite;
        z-index: -1;
      }

      @keyframes gradientShift {
        0%,
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.15) rotate(2deg);
        }
      }

      .demo-controls {
        text-align: center;
        margin-bottom: 40px;
      }

      .demo-controls h1 {
        font-size: 2rem;
        background: linear-gradient(135deg, #8ab4ff, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 20px;
      }

      .demo-btn {
        padding: 14px 32px;
        margin: 8px;
        border-radius: 16px;
        border: 1px solid rgba(138, 180, 255, 0.3);
        background: var(--primary-gradient);
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 0.95rem;
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
      }

      .demo-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(102, 126, 234, 0.6);
      }

      /* ============================================
         MODAL BACKDROP
         ============================================ */
      .student-profile-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        z-index: 50000;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .student-profile-backdrop.active {
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
      }

      /* ============================================
         GLASSMORPHISM STUDENT PROFILE CARD
         ============================================ */
      .student-profile-card {
        width: 95%;
        max-width: 480px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        overflow: hidden;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        transform: scale(0.9) translateY(40px);
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }

      .student-profile-backdrop.active .student-profile-card {
        transform: scale(1) translateY(0);
        opacity: 1;
      }

      /* Top accent line */
      .card-accent {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--primary-gradient);
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
      }

      /* ============================================
         ANIMATED HEADER
         ============================================ */
      .profile-header {
        position: relative;
        background: linear-gradient(135deg, rgba(138, 180, 255, 0.15), rgba(168, 85, 247, 0.15));
        padding: 28px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      /* Animated corner accents */
      .profile-header::before,
      .profile-header::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.4;
        animation: pulse 8s ease-in-out infinite;
      }

      .profile-header::before {
        top: -60px;
        right: -60px;
        width: 180px;
        height: 180px;
        background: radial-gradient(circle, rgba(118, 75, 162, 0.6), transparent);
      }

      .profile-header::after {
        bottom: -40px;
        left: -40px;
        width: 140px;
        height: 140px;
        background: radial-gradient(circle, rgba(79, 172, 254, 0.5), transparent);
        animation-delay: 4s;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.2);
          opacity: 0.6;
        }
      }

      .header-grid {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      /* Avatar Section */
      .avatar-container {
        position: relative;
        flex-shrink: 0;
      }

      .avatar-orbit {
        position: absolute;
        inset: -8px;
        border-radius: 24px;
        border: 2px solid transparent;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.6), rgba(118, 75, 162, 0.4)) border-box;
        -webkit-mask:
          linear-gradient(#fff 0 0) padding-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: rotate 12s linear infinite;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .avatar-main {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: var(--primary-gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.7rem;
        font-weight: 800;
        color: white;
        box-shadow:
          0 12px 30px rgba(102, 126, 234, 0.5),
          inset 0 2px 4px rgba(255, 255, 255, 0.2);
        border: 3px solid rgba(255, 255, 255, 0.15);
      }

      .avatar-status-badge {
        position: absolute;
        bottom: -6px;
        right: -6px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--success-gradient);
        border: 3px solid rgba(13, 17, 43, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.6);
        animation: statusPulse 3s ease-in-out infinite;
      }

      .avatar-status-badge.paused {
        background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        box-shadow: 0 4px 12px rgba(251, 191, 36, 0.6);
      }

      .avatar-status-badge.graduated {
        background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        box-shadow: 0 4px 12px rgba(139, 92, 246, 0.6);
      }

      @keyframes statusPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      /* Identity Info */
      .identity-info {
        flex: 1;
        min-width: 0;
      }

      .identity-label {
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 600;
        margin-bottom: 6px;
      }

      .identity-name {
        font-size: 1.6rem;
        font-weight: 800;
        background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.8) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.2;
        margin-bottom: 10px;
      }

      .identity-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .meta-badge {
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .meta-badge.group {
        background: rgba(102, 126, 234, 0.25);
        border: 1px solid rgba(102, 126, 234, 0.4);
        color: #c7d2fe;
        box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
      }

      .meta-badge.price {
        background: rgba(79, 172, 254, 0.2);
        border: 1px solid rgba(79, 172, 254, 0.4);
        color: #bfdbfe;
      }

      /* Header Controls */
      .header-controls {
        position: absolute;
        top: 24px;
        right: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 2;
      }

      .status-pill-modern {
        padding: 10px 20px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .status-pill-modern.active {
        background: rgba(16, 185, 129, 0.25);
        border: 2px solid rgba(16, 185, 129, 0.5);
        color: #6ee7b7;
        box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
      }

      .status-pill-modern.paused {
        background: rgba(251, 191, 36, 0.2);
        border: 2px solid rgba(251, 191, 36, 0.4);
        color: #fde047;
        box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
      }

      .status-pill-modern.graduated {
        background: rgba(139, 92, 246, 0.2);
        border: 2px solid rgba(139, 92, 246, 0.4);
        color: #c4b5fd;
        box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
      }

      .toggle-switch-modern {
        position: relative;
        width: 56px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.15);
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .toggle-switch-modern.active {
        background: var(--primary-gradient);
        border-color: transparent;
        box-shadow: 0 4px 16px rgba(102, 126, 234, 0.6);
      }

      .toggle-slider-modern {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: white;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .toggle-switch-modern.active .toggle-slider-modern {
        transform: translateX(28px);
      }

      .close-btn {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        transition: all 0.3s ease;
      }

      .close-btn:hover {
        background: var(--secondary-gradient);
        transform: scale(1.1) rotate(90deg);
        box-shadow: 0 8px 24px rgba(240, 147, 251, 0.6);
        border-color: transparent;
      }

      /* ============================================
         STATS GRID
         ============================================ */
      .glass-stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1px;
        background: rgba(255, 255, 255, 0.05);
      }

      .glass-stat {
        padding: 18px;
        background: rgba(0, 0, 0, 0.2);
        text-align: center;
        box-shadow:
          inset 2px 2px 4px rgba(0, 0, 0, 0.15),
          inset -2px -2px 4px rgba(255, 255, 255, 0.05);
      }

      .glass-stat-label {
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .glass-stat-value {
        font-size: 1.2rem;
        font-weight: 800;
        color: #8ab4ff;
      }

      .glass-stat-value.credit {
        color: #fbbf24;
      }

      .glass-stat-value.phone {
        font-size: 0.9rem;
        color: #c084fc;
      }

      .glass-stat-value.email {
        font-size: 0.75rem;
        color: #94a3b8;
        word-break: break-all;
      }

      /* ============================================
         ACTIONS SECTION (Group & Amount Buttons)
         ============================================ */
      .glass-actions {
        padding: 20px;
        background: rgba(0, 0, 0, 0.15);
      }

      .glass-section-title {
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
        text-align: center;
        font-weight: 700;
      }

      .glass-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        margin-bottom: 16px;
      }

      .glass-buttons:last-child {
        margin-bottom: 0;
      }

      /* WHITE EMBOSS BUTTONS */
      .btn-wrapper {
        --size: 40px;
        --padding: 5px;
        --hue: 142deg;

        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 10px 22px rgba(0, 0, 0, 0.12),
          0 4px 10px rgba(0, 0, 0, 0.06),
          inset 2px 2px 5px rgba(255, 255, 255, 0.8),
          inset -2px -2px 6px rgba(0, 0, 0, 0.04);
        transition: all 0.3s ease;
      }

      .btn-wrapper:has(.btn.active) {
        --size: 50px;
        box-shadow:
          0 0 15px hsla(var(--hue), 100%, 60%, 0.35),
          0 0 30px hsla(var(--hue), 100%, 60%, 0.21),
          0 0 45px hsla(var(--hue), 100%, 60%, 0.1),
          0 10px 22px rgba(0, 0, 0, 0.12),
          0 4px 10px rgba(0, 0, 0, 0.06),
          inset 2px 2px 5px rgba(255, 255, 255, 0.8),
          inset -2px -2px 6px rgba(0, 0, 0, 0.04);
      }

      .btn-wrapper.group-A {
        --hue: 346deg;
      }
      .btn-wrapper.group-B {
        --hue: 23deg;
      }
      .btn-wrapper.group-C {
        --hue: 50deg;
      }
      .btn-wrapper.group-D {
        --hue: 145deg;
      }
      .btn-wrapper.group-E {
        --hue: 204deg;
      }
      .btn-wrapper.group-F {
        --hue: 260deg;
      }

      .btn-wrapper.amount {
        --hue: 145deg;
      }

      .btn {
        width: calc(100% - 2 * var(--padding));
        height: calc(100% - 2 * var(--padding));
        border-radius: 50%;
        border: none;
        cursor: pointer;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          inset 3px 3px 6px rgba(0, 0, 0, 0.12),
          inset -3px -3px 7px rgba(255, 255, 255, 0.9),
          0 3px 6px rgba(0, 0, 0, 0.08);
        transition:
          transform 0.15s ease,
          box-shadow 0.25s ease;
      }

      .btn-txt {
        font-size: 18px;
        font-weight: 700;
        line-height: 1;
        display: flex;
        align-items: center;
        color: #333;
        transition: all 0.3s ease;
      }

      .btn-txt.small {
        font-size: 13px;
      }

      .btn.active {
        box-shadow:
          inset 2px 2px 6px rgba(255, 255, 255, 0.9),
          inset -4px -4px 12px rgba(0, 0, 0, 0.08),
          0 0 18px hsla(var(--hue), 80%, 65%, 0.25);
      }

      .btn.active .btn-txt {
        background: linear-gradient(180deg, hsla(var(--hue), 100%, 48%, 1), hsla(var(--hue), 90%, 35%, 1));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 7px hsla(var(--hue), 100%, 48%, 0.95))
          drop-shadow(0 0 12px hsla(var(--hue), 100%, 38%, 0.85));
      }

      .btn:active {
        transform: scale(0.96);
      }

      /* ============================================
         EDIT FIELDS SECTION
         ============================================ */
      .edit-section {
        padding: 20px;
        background: rgba(0, 0, 0, 0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .edit-section.expanded {
        max-height: 600px;
        opacity: 1;
        padding: 20px;
      }

      .edit-form-group {
        margin-bottom: 16px;
      }

      .edit-label {
        display: block;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 8px;
        font-weight: 600;
      }

      .edit-input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
        font-size: 0.9rem;
        font-family: inherit;
        transition: all 0.3s ease;
      }

      .edit-input:focus {
        outline: none;
        border-color: rgba(102, 126, 234, 0.5);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
      }

      .edit-input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      textarea.edit-input {
        min-height: 80px;
        resize: vertical;
      }

      .edit-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .save-btn,
      .cancel-btn,
      .credit-btn {
        flex: 1;
        padding: 12px 20px;
        border-radius: 14px;
        border: none;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .save-btn {
        background: var(--primary-gradient);
        color: white;
        box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
      }

      .save-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(102, 126, 234, 0.6);
      }

      .credit-btn {
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: white;
        box-shadow: 0 4px 16px rgba(251, 191, 36, 0.4);
      }

      .credit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(251, 191, 36, 0.6);
      }

      .cancel-btn {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-secondary);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .cancel-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
      }

      /* Expand/Collapse Toggle */
      .expand-toggle {
        text-align: center;
        padding: 14px;
        background: rgba(0, 0, 0, 0.15);
        cursor: pointer;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        color: rgba(138, 180, 255, 0.8);
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transition: all 0.3s ease;
      }

      .expand-toggle:hover {
        background: rgba(138, 180, 255, 0.1);
        color: #8ab4ff;
      }

      .expand-toggle::after {
        content: ' ▼';
        display: inline-block;
        transition: transform 0.3s ease;
      }

      .expand-toggle.expanded::after {
        transform: rotate(180deg);
      }

      /* Footer */
      .glass-footer {
        text-align: center;
        padding: 12px;
        color: rgba(138, 180, 255, 0.35);
        font-size: 0.65rem;
        font-style: italic;
        background: rgba(0, 0, 0, 0.1);
      }

      /* Responsive */
      @media (max-width: 640px) {
        .student-profile-card {
          max-width: 100%;
          max-height: 90vh;
          overflow-y: auto;
        }

        .header-grid {
          flex-direction: column;
          text-align: center;
        }

        .header-controls {
          position: relative;
          top: auto;
          right: auto;
          margin-top: 16px;
          justify-content: center;
        }

        .identity-meta {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <!-- Demo Controls -->
    <div class="demo-controls">
      <h1>✨ ARNOMA Student Profile Card</h1>
      <p style="color: rgba(255, 255, 255, 0.6); margin-bottom: 20px">
        Final Glassmorphism Design - Click to open different students
      </p>
      <button class="demo-btn" onclick="openStudentProfile(demoStudents[0])">Open Ana (Active)</button>
      <button class="demo-btn" onclick="openStudentProfile(demoStudents[1])">Open John (Paused)</button>
      <button class="demo-btn" onclick="openStudentProfile(demoStudents[2])">Open Sarah (Graduated)</button>
    </div>

    <!-- Student Profile Modal -->
    <div class="student-profile-backdrop" id="studentProfileBackdrop" onclick="closeStudentProfile(event)">
      <div class="student-profile-card" onclick="event.stopPropagation()">
        <div class="card-accent"></div>

        <!-- HEADER -->
        <div class="profile-header">
          <div class="header-controls">
            <div
              class="status-pill-modern active"
              id="statusPill"
              onclick="cycleStatus()"
              title="Click to cycle status"
            >
              ACTIVE
            </div>
            <div class="toggle-switch-modern active" id="visibilityToggle" onclick="toggleVisibility()">
              <div class="toggle-slider-modern"></div>
            </div>
            <button class="close-btn" onclick="closeStudentProfile()">×</button>
          </div>

          <div class="header-grid">
            <div class="avatar-container">
              <div class="avatar-orbit"></div>
              <div class="avatar-main" id="avatarMain">AN</div>
              <div class="avatar-status-badge" id="statusBadge">✓</div>
            </div>

            <div class="identity-info">
              <div class="identity-label">Student Profile</div>
              <div class="identity-name" id="studentName">Ana Nshanyan</div>
              <div class="identity-meta">
                <span class="meta-badge group" id="groupBadge">
                  <span>👥</span>
                  <span id="groupText">Group A</span>
                </span>
                <span class="meta-badge price" id="priceBadge">
                  <span>💰</span>
                  <span id="priceText">$100</span>
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- STATS GRID -->
        <div class="glass-stats">
          <div class="glass-stat">
            <div class="glass-stat-label">Pay/Class</div>
            <div class="glass-stat-value" id="statPay">$100</div>
          </div>
          <div class="glass-stat">
            <div class="glass-stat-label">Credit</div>
            <div class="glass-stat-value credit" id="statCredit">$0</div>
          </div>
          <div class="glass-stat">
            <div class="glass-stat-label">Phone</div>
            <div class="glass-stat-value phone" id="statPhone">+1 555-0100</div>
          </div>
          <div class="glass-stat">
            <div class="glass-stat-label">Email</div>
            <div class="glass-stat-value email" id="statEmail">ana@example.com</div>
          </div>
        </div>

        <!-- ACTIONS SECTION -->
        <div class="glass-actions">
          <div class="glass-section-title">Switch Group</div>
          <div class="glass-buttons" id="groupButtons">
            <!-- Generated dynamically -->
          </div>

          <div class="glass-section-title" style="margin-top: 16px">Set Pay Amount</div>
          <div class="glass-buttons" id="amountButtons">
            <!-- Generated dynamically -->
          </div>
        </div>

        <!-- EXPAND TOGGLE -->
        <div class="expand-toggle" id="expandToggle" onclick="toggleEditSection()">
          📝 Edit Details & Notes
        </div>

        <!-- EDIT SECTION -->
        <div class="edit-section" id="editSection">
          <div class="edit-form-group">
            <label class="edit-label" for="editEmail">Email Address</label>
            <input
              type="email"
              class="edit-input"
              id="editEmail"
              placeholder="student@example.com"
              value="ana@example.com"
            />
          </div>

          <div class="edit-form-group">
            <label class="edit-label" for="editPhone">Phone Number</label>
            <input type="tel" class="edit-input" id="editPhone" placeholder="+1 (555) 000-0000" value="+1 555-0100" />
          </div>

          <div class="edit-form-group">
            <label class="edit-label" for="editNotes">Notes</label>
            <textarea
              class="edit-input"
              id="editNotes"
              placeholder="Additional notes about the student..."
            ></textarea>
          </div>

          <div class="edit-actions">
            <button class="save-btn" onclick="saveChanges()">💾 Save</button>
            <button class="credit-btn" onclick="applyCredit()">💳 Credit</button>
            <button class="cancel-btn" onclick="toggleEditSection()">Cancel</button>
          </div>
        </div>

        <!-- FOOTER -->
        <div class="glass-footer">Student ID: <span id="studentId">123</span></div>
      </div>
    </div>

    <script>
      // Demo student data
      const demoStudents = [
        {
          id: 1,
          name: 'Ana Nshanyan',
          initials: 'AN',
          group: 'A',
          payPerClass: 100,
          balance: 0,
          phone: '+1 555-0100',
          email: 'ana@example.com',
          status: 'active',
          showInGrid: true,
          notes: 'Great student, always on time.',
        },
        {
          id: 2,
          name: 'John Doe',
          initials: 'JD',
          group: 'B',
          payPerClass: 75,
          balance: 50,
          phone: '+1 555-0200',
          email: 'john@example.com',
          status: 'paused',
          showInGrid: false,
          notes: 'On temporary leave.',
        },
        {
          id: 3,
          name: 'Sarah Smith',
          initials: 'SS',
          group: 'C',
          payPerClass: 50,
          balance: 100,
          phone: 'N/A',
          email: '',
          status: 'graduated',
          showInGrid: true,
          notes: 'Completed all courses successfully!',
        },
      ];

      let currentStudent = null;

      // Open student profile
      function openStudentProfile(student) {
        currentStudent = student;

        // Update all UI elements
        document.getElementById('studentName').textContent = student.name;
        document.getElementById('avatarMain').textContent = student.initials;
        document.getElementById('groupText').textContent = 'Group ' + student.group;
        document.getElementById('priceText').textContent = '$' + student.payPerClass;
        document.getElementById('statPay').textContent = '$' + student.payPerClass;
        document.getElementById('statCredit').textContent = '$' + student.balance;
        document.getElementById('statPhone').textContent = student.phone || 'N/A';
        document.getElementById('statEmail').textContent = student.email || 'Not set';
        document.getElementById('editEmail').value = student.email || '';
        document.getElementById('editPhone').value = student.phone || '';
        document.getElementById('editNotes').value = student.notes || '';
        document.getElementById('studentId').textContent = student.id;

        // Update status
        const statusPill = document.getElementById('statusPill');
        const statusBadge = document.getElementById('statusBadge');
        statusPill.className = `status-pill-modern ${student.status}`;
        statusPill.textContent = student.status.toUpperCase();
        statusBadge.className = `avatar-status-badge ${student.status}`;

        // Update visibility toggle
        const toggle = document.getElementById('visibilityToggle');
        if (student.showInGrid) {
          toggle.classList.add('active');
        } else {
          toggle.classList.remove('active');
        }

        // Generate group buttons
        generateGroupButtons(student.group);

        // Generate amount buttons
        generateAmountButtons(student.payPerClass);

        // Show modal with animation
        const backdrop = document.getElementById('studentProfileBackdrop');
        backdrop.classList.add('active');

        console.log('✅ Opened student profile:', student.name);
      }

      // Close student profile
      function closeStudentProfile(event) {
        if (event && event.target !== event.currentTarget) return;

        const backdrop = document.getElementById('studentProfileBackdrop');
        backdrop.classList.remove('active');

        // Reset edit section
        const editSection = document.getElementById('editSection');
        const expandToggle = document.getElementById('expandToggle');
        editSection.classList.remove('expanded');
        expandToggle.classList.remove('expanded');

        console.log('✖️ Closed student profile');
      }

      // Generate group buttons
      function generateGroupButtons(currentGroup) {
        const container = document.getElementById('groupButtons');
        const groups = ['A', 'B', 'C', 'D', 'E', 'F'];

        container.innerHTML = groups
          .map(
            g => `
          <div class="btn-wrapper group-${g}">
            <button class="btn ${currentGroup === g ? 'active' : ''}" onclick="selectGroup('${g}')">
              <span class="btn-txt">${g}</span>
            </button>
          </div>
        `
          )
          .join('');
      }

      // Generate amount buttons
      function generateAmountButtons(currentAmount) {
        const container = document.getElementById('amountButtons');
        const amounts = [25, 50, 75, 100];

        container.innerHTML = amounts
          .map(
            amount => `
          <div class="btn-wrapper amount">
            <button class="btn ${currentAmount === amount ? 'active' : ''}" onclick="selectAmount(${amount})">
              <span class="btn-txt small">$${amount}</span>
            </button>
          </div>
        `
          )
          .join('');
      }

      // Select group
      function selectGroup(group) {
        if (!currentStudent) return;

        currentStudent.group = group;
        document.getElementById('groupText').textContent = 'Group ' + group;

        // Regenerate buttons to update active state
        generateGroupButtons(group);

        console.log('👥 Group changed to:', group);
      }

      // Select amount
      function selectAmount(amount) {
        if (!currentStudent) return;

        currentStudent.payPerClass = amount;
        document.getElementById('priceText').textContent = '$' + amount;
        document.getElementById('statPay').textContent = '$' + amount;

        // Regenerate buttons to update active state
        generateAmountButtons(amount);

        console.log('💰 Pay/class changed to:', amount);
      }

      // Cycle status
      function cycleStatus() {
        if (!currentStudent) return;

        const statusCycle = {
          active: 'paused',
          paused: 'graduated',
          graduated: 'active',
        };

        currentStudent.status = statusCycle[currentStudent.status];

        const statusPill = document.getElementById('statusPill');
        const statusBadge = document.getElementById('statusBadge');

        statusPill.className = `status-pill-modern ${currentStudent.status}`;
        statusPill.textContent = currentStudent.status.toUpperCase();
        statusBadge.className = `avatar-status-badge ${currentStudent.status}`;

        console.log('✅ Status changed to:', currentStudent.status);
      }

      // Toggle visibility
      function toggleVisibility() {
        if (!currentStudent) return;

        currentStudent.showInGrid = !currentStudent.showInGrid;

        const toggle = document.getElementById('visibilityToggle');
        if (currentStudent.showInGrid) {
          toggle.classList.add('active');
        } else {
          toggle.classList.remove('active');
        }

        console.log('📅 Show in calendar:', currentStudent.showInGrid);
      }

      // Toggle edit section
      function toggleEditSection() {
        const editSection = document.getElementById('editSection');
        const expandToggle = document.getElementById('expandToggle');

        editSection.classList.toggle('expanded');
        expandToggle.classList.toggle('expanded');
      }

      // Save changes
      function saveChanges() {
        if (!currentStudent) return;

        const email = document.getElementById('editEmail').value.trim();
        const phone = document.getElementById('editPhone').value.trim();
        const notes = document.getElementById('editNotes').value.trim();

        currentStudent.email = email;
        currentStudent.phone = phone;
        currentStudent.notes = notes;

        // Update display
        document.getElementById('statEmail').textContent = email || 'Not set';
        document.getElementById('statPhone').textContent = phone || 'N/A';

        console.log('💾 Saved changes:', { email, phone, notes });

        alert('✅ Changes saved!\n\nIn production, this would save to Supabase.');

        // Collapse edit section
        toggleEditSection();
      }

      // Apply credit
      function applyCredit() {
        if (!currentStudent) return;

        const amount = prompt('Enter credit amount to apply:');
        if (!amount || isNaN(amount)) return;

        const creditAmount = parseFloat(amount);
        currentStudent.balance += creditAmount;

        document.getElementById('statCredit').textContent = '$' + currentStudent.balance;

        console.log('💳 Applied credit:', creditAmount);

        alert(`✅ Credit of $${creditAmount} applied!\n\nNew balance: $${currentStudent.balance}`);
      }

      // ESC key to close
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          closeStudentProfile();
        }
      });
    </script>
  </body>
</html>
