<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARNOMA - Student Profile Header (Simple)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
        --dark-bg: #1a1d35;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.65);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #1a1d35;
        min-height: 100vh;
        padding: 40px 20px;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      /* Animated background gradient */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.12) 0%, transparent 50%);
        animation: gradientShift 20s ease infinite;
        z-index: -1;
      }

      @keyframes gradientShift {
        0%,
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.15) rotate(2deg);
        }
      }

      /* Demo container */
      .demo-container {
        max-width: 900px;
        width: 100%;
      }

      .demo-title {
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 40px;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Demo buttons */
      .demo-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 40px;
        flex-wrap: wrap;
      }

      .demo-btn {
        padding: 14px 28px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      }

      .demo-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(102, 126, 234, 0.5);
        box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        transform: translateY(-2px);
      }

      /* Student Profile Header (from screenshot) */
      .student-profile-header {
        background: rgba(26, 29, 53, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 32px;
        display: flex;
        align-items: center;
        gap: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      /* Avatar with status badge */
      .avatar-container {
        position: relative;
        flex-shrink: 0;
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 28px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: 700;
        color: white;
        border: 3px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
      }

      .status-badge {
        position: absolute;
        bottom: 4px;
        right: 4px;
        width: 32px;
        height: 32px;
        background: #10b981;
        border-radius: 50%;
        border: 3px solid #1a1d35;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 3s ease-in-out infinite;
      }

      .status-badge svg {
        width: 18px;
        height: 18px;
        color: white;
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
        }
      }

      .status-badge.paused {
        background: #f59e0b;
        animation: pulse-paused 3s ease-in-out infinite;
      }

      .status-badge.graduated {
        background: #a855f7;
        animation: pulse-graduated 3s ease-in-out infinite;
      }

      @keyframes pulse-paused {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(245, 158, 11, 0);
        }
      }

      @keyframes pulse-graduated {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(168, 85, 247, 0);
        }
      }

      /* Identity section */
      .identity-section {
        flex: 1;
      }

      .profile-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text-secondary);
        margin-bottom: 8px;
        font-weight: 600;
      }

      .student-name {
        font-size: 42px;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 20px;
        color: white;
      }

      .meta-badges {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .meta-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 15px;
        font-weight: 600;
        backdrop-filter: blur(10px);
      }

      .meta-badge.group {
        color: #c7d2fe;
        border-color: rgba(199, 210, 254, 0.2);
      }

      .meta-badge.price {
        color: #86efac;
        border-color: rgba(134, 239, 172, 0.2);
      }

      .meta-badge svg {
        width: 18px;
        height: 18px;
        opacity: 0.8;
      }

      @media (max-width: 640px) {
        .student-profile-header {
          flex-direction: column;
          text-align: center;
        }

        .student-name {
          font-size: 32px;
        }

        .meta-badges {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="demo-container">
      <h1 class="demo-title">Student Profile Header</h1>

      <div class="demo-buttons">
        <button class="demo-btn" onclick="showStudent(0)">Ana Martinez (Active)</button>
        <button class="demo-btn" onclick="showStudent(1)">John Doe (Paused)</button>
        <button class="demo-btn" onclick="showStudent(2)">Sarah Kim (Graduated)</button>
      </div>

      <div class="student-profile-header" id="studentHeader">
        <!-- Dynamic content loads here -->
      </div>
    </div>

    <script>
      const demoStudents = [
        {
          name: 'Ana Martinez',
          initials: 'AM',
          group: 'Group A',
          price: '$50',
          status: 'active',
        },
        {
          name: 'John Doe',
          initials: 'JD',
          group: 'Group B',
          price: '$75',
          status: 'paused',
        },
        {
          name: 'Sarah Kim',
          initials: 'SK',
          group: 'Group C',
          price: '$100',
          status: 'graduated',
        },
      ];

      function getStatusIcon(status) {
        if (status === 'active') {
          return `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
        } else if (status === 'paused') {
          return `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 9v6m4-6v6"></path></svg>`;
        } else {
          return `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
        }
      }

      function showStudent(index) {
        const student = demoStudents[index];
        const header = document.getElementById('studentHeader');

        header.innerHTML = `
          <div class="avatar-container">
            <div class="avatar">${student.initials}</div>
            <div class="status-badge ${student.status}">
              ${getStatusIcon(student.status)}
            </div>
          </div>
          <div class="identity-section">
            <div class="profile-label">STUDENT PROFILE</div>
            <div class="student-name">${student.name}</div>
            <div class="meta-badges">
              <div class="meta-badge group">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
                ${student.group}
              </div>
              <div class="meta-badge price">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                ${student.price}
              </div>
            </div>
          </div>
        `;
      }

      // Show first student on load
      showStudent(0);
    </script>
  </body>
</html>
